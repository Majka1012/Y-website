<div class="news">
  <h2>LATEST NEWS!</h2>
  @if (news()) {
    @for (n of news(); track $index) {
      <a href="{{ n.link }}" target="_blank" class="article">
        <p class="artTitle">{{ n.title }}</p>
        @if (n.image_url) {
          <!-- <img src="{{ n.image_url }}" alt="" /> -->
        }
        <p class="artCreator">{{ n.creator }}</p>
      </a>
      <div class="vl"></div>
    }
  }
</div>
