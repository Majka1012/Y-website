<div class="split">
  <div class="profile">
    <div class="mini-header">
      <a href=""><i class="fa-solid fa-arrow-left"></i></a>
      <p>number of posts</p>
    </div>
    <div class="vl"></div>
    <div class="user-info">
      <div class="background-wrapper">
        <img src="backgound.png" alt="background image" class="backgound-image" />
        <div class="userIconBox">
          <img src="userIcon.png" alt="" class="userIcon" />
        </div>
      </div>
      <div class="edit">
        <button type="button">Edit Profile</button>
      </div>
      @if (userData()) {
        <div>
          <h2>{{ userData()!.userName }}</h2>
          <p>@{{ userHandle() }}</p>
          <p>{{ userData()!.bio }}</p>
          <div class="follow">
            <p>FOLLOWING: {{ userData()!.followingCount }}</p>
            <p>FOLLOWERS: {{ userData()!.followersCount }}</p>
          </div>
        </div>
      }
    </div>

    <div>
      <ul class="menuProfile">
        <a href=""> <li class="Posts">Posts</li></a>
        <a href=""><li class="Replies">Replies</li></a>
        <a href=""><li class="Likes">Likes</li></a>
        <a href=""><li class="Bookmarked">Bookmarked</li></a>
      </ul>
    </div>

    <div class="vl"></div>

    <app-user-posts [userHandle]="userHandle()"></app-user-posts>
  </div>
  <hr />
  <div class="news">
    <app-news></app-news>
  </div>
</div>
