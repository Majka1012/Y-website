<div class="modal" (click)="onCancel()">
  <div class="form-popup" (click)="noCancel($event)">
    <h2>Edit Profile</h2>
    <form (submit)="onSubmit($event)" class="form-container">
      <div class="input-profile">
        <label for="name">User Name</label>
        <input type="text" id="name" [formField]="editForm.userName" />
      </div>
      <div class="input-profile">
        <label for="avatar">Avatar</label>
        <input type="file" name="avatar" id="avatar" accept="image/*" />
      </div>
      <div class="input-profile">
        <label for="bio">Bio</label>
        <input type="text" id="bio" [formField]="editForm.bio" />
      </div>

      <div class="buttons">
        <button type="submit">Save</button>
        <button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
