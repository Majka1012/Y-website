<div class="post">
  <form (submit)="$event.preventDefault()">
    <div class="upperPost">
      <img
        src="userIcon.png"
        [attr.aria-label]="this.currentUser.userName + ' avatar'"
        class="userIcon"
      />
      <textarea
        name="inputPost"
        id="inputPost"
        placeholder="Write something!"
        [(ngModel)]="text"
        (input)="autoResize($event)"
        tabindex="0"
      ></textarea>
    </div>
    <div class="lowerPost">
      <ul>
        <li>
          <button
            class="image-upload"
            type="button"
            (click)="fileInput.click()"
            aria-label="upload image"
          >
            <i class="fa-regular fa-image"></i>
            <input type="file" accept="image/*" hidden #fileInput enterkeyhint="send" />
          </button>
        </li>
        <li class="emoji-wrapper">
          <button
            type="button"
            class="icon-btn"
            (click)="emojiSelector($event)"
            aria-label="emoji picker"
          >
            <i class="fa-regular fa-face-laugh-beam"></i>
          </button>
          @if (showEmojiPicker) {
            <div class="emojiPicker" #emojiContainer>
              <app-emoji-picker (pickedEmoji)="onEmojiPicked($event)"></app-emoji-picker>
            </div>
          }
        </li>
        <li>
          <button
            type="button"
            class="icon-btn"
            (click)="onLocation()"
            aria-label="current location"
          >
            <i class="fa-solid fa-location-dot"></i>
          </button>
        </li>
        <li id="postButton">
          <button type="button" class="icon-btn" (click)="onPost()">POST</button>
        </li>
      </ul>
    </div>
  </form>
</div>
