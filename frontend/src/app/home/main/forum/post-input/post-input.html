<div class="post">
  <!-- <p>GET: {{ getJsonValue | json }} oraz POST: {{ postJsonValue | json }}</p> -->
  <form (submit)="$event.preventDefault()">
    <div class="upperPost">
      <img src="userIcon.png" alt="userIcon" />
      <textarea
        name="inputPost"
        id="inputPost"
        placeholder="Write something!"
        [(ngModel)]="text"
        tabindex="0"
      ></textarea>
    </div>
    <div class="lowerPost">
      <ul>
        <li>
          <label class="image-upload">
            <i class="fa-regular fa-image"></i>
            <input type="file" tabindex="0" accept="image/*" hidden />
          </label>
        </li>
        <li class="emoji-wrapper">
          <i
            class="fa-regular fa-face-laugh-beam"
            tabindex="0"
            (click)="emojiSelector($event)"
            (keydown.enter)="emojiSelector($event)"
          ></i>
          @if (showEmojiPicker) {
            <div class="emojiPicker" #emojiContainer>
              <app-emoji-picker (pickedEmoji)="onEmojiPicked($event)"></app-emoji-picker>
            </div>
          }
        </li>
        <li>
          <i
            class="fa-solid fa-location-dot"
            tabindex="0"
            (click)="onLocation()"
            (keydown.enter)="onLocation()"
          ></i>
        </li>
        <li id="postButton" tabindex="0" (click)="onPost()" (keydown.enter)="onPost()">POST</li>
      </ul>
    </div>
  </form>
</div>
