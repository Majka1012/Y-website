<div class="post">
  <form (submit)="$event.preventDefault()">
    <div class="upperPost">
      <img src="userIcon.png" alt="userIcon" class="userIcon" />
      <textarea
        name="inputPost"
        id="inputPost"
        placeholder="Write something!"
        [(ngModel)]="text"
        (input)="autoResize($event)"
        tabindex="0"
      ></textarea>
    </div>
    <div class="lowerPost">
      <ul>
        <li>
          <label class="image-upload">
            <i class="fa-regular fa-image"></i>
            <input type="file" tabindex="0" accept="image/*" hidden />
          </label>
        </li>
        <li class="emoji-wrapper">
          <button type="button" class="icon-btn" (click)="emojiSelector($event)">
            <i class="fa-regular fa-face-laugh-beam"></i>
          </button>
          @if (showEmojiPicker) {
            <div class="emojiPicker" #emojiContainer>
              <app-emoji-picker (pickedEmoji)="onEmojiPicked($event)"></app-emoji-picker>
            </div>
          }
        </li>
        <li>
          <button type="button" class="icon-btn" (click)="onLocation()">
            <i class="fa-solid fa-location-dot"></i>
          </button>
        </li>
        <li id="postButton">
          <button type="button" class="icon-btn" (click)="onPost()">POST</button>
        </li>
      </ul>
    </div>
  </form>
</div>
